<html>
<head>
<link href="https://fonts.googleapis.com/css?family=Indie+Flower" rel="stylesheet">
<style>
body{
font-family: 'Indie Flower', cursive;
}

div{
margin: 20px;
padding: 10px;
border: 2px solid black;
border-radius: 10px;
background-color: #ccc;
text-align: center;
font-size: 60px;
}

img{
margin: 0 20px;
}

.a{
vertical-align: text-top;
}

.b{
vertical-align: middle;
}

.c{
vertical-align: bottom;
}
</style>

</head>
<body>

<div>Charlie <img src="charlie.jpg" alt="link"/> Chaplin</div>
<div>Charlie <img class="a" src="charlie.jpg" alt="link"/> Chaplin</div>
<div>Charlie <img class="b" src="charlie.jpg" alt="link"/> Chaplin</div>
<div>Charlie <img class="c" src="charlie.jpg" alt="link"/> Chaplin</div>

</body>
</html>
